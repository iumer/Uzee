name: CI

on:
  push:
    # Docs-only pushes don't need the 25-minute simulator run.
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks-linux:
    name: Secret check (ENV-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-secrets.sh
      - name: No Double or Float in money code (M2 acceptance 1)
        run: |
          if grep -rnwE 'Double|Float' Packages/UZeeCore/Sources/UZeeCore/Money Packages/UZeeCore/Sources/UZeeCore/Accounts \
               Packages/UZeeCore/Sources/UZeeCore/Transactions Packages/UZeeCore/Sources/UZeeCore/Budget \
               Packages/UZeeData/Sources/UZeeData/Ledger | grep -v '///'; then
            echo "::error::Money code must use Int64 minor units and Decimal only"; exit 1
          fi

  core-linux:
    name: UZeeCore tests on Linux (ENV-001)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/UZeeCore

  data-linux:
    name: UZeeData tests on Linux (database, ~3 min)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev > /dev/null
      - run: swift test --package-path Packages/UZeeData

  ios:
    name: Build and test on iPhone and iPad simulators (ENV-002)
    # GitHub's Mac machines take ~20-30 min, so this runs once per milestone (manual run) and on main.
    # Day-to-day checks run on the owner's Mac simulator, which takes ~4 min.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Pick simulators
        run: scripts/ci-pick-simulators.sh >> "$GITHUB_ENV"
      - name: Start booting simulators early
        # A fresh simulator spends minutes on first-boot data migration; let it run during the builds.
        # Only the iPhone: booting the iPad at the same time slowed the iPhone smoke past its timeout (run #16).
        run: xcrun simctl boot "$IPHONE_ID" || true
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            Packages/UZeeData/.build
            Packages/UZeeSystem/.build
            build/dd/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Package tests on the Mac host
        # UZeeData and UZeeSystem also support macOS, so they test natively without a simulator.
        # UZeeCore is pure Swift and already tested in core-linux.
        run: |
          for pkg in UZeeData UZeeSystem; do
            echo "::group::$pkg"
            swift test --package-path "Packages/$pkg" 2>&1 | grep -E "error:|✔|✘|Test run|passed|failed" 
            echo "::endgroup::"
          done
      - name: UZeeUI tests on iPhone simulator
        # UZeeUI is iOS-only, so it needs the simulator.
        run: scripts/ci-test-package.sh UZeeUI "$IPHONE_DEST"
      - name: Build app for testing
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project UZee.xcodeproj -scheme UZee -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/build.log | grep -E "error:|\*\* " || (tail -60 build/build.log; exit 1)
      - name: Smoke UI tests on iPhone
        timeout-minutes: 25
        run: |
          scripts/ci-run-smoke.sh "$IPHONE_ID" iphone
          xcrun simctl shutdown "$IPHONE_ID" || true
      - name: Smoke UI tests on iPad
        timeout-minutes: 25
        run: scripts/ci-run-smoke.sh "$IPAD_ID" ipad
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/*.xcresult
            build/*.log
          if-no-files-found: ignore
